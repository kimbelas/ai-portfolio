name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  knowledge-assistant:
    name: ai-knowledge-assistant · typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-knowledge-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Unit tests (deterministic — no API key, no model download)
        run: npm test
